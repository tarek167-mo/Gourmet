<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOURMET - Contact Us</title>
    <style>
        /* 1. BASE STYLES */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1E1E1E;
            color: #F8F9FA;
            line-height: 1.6;
        }
        h1, h2 { font-family: 'Georgia', serif; color: #D4A373; font-weight: normal; }

        /* 2. NAVIGATION */
        nav {
            position: fixed;
            top: 0; width: 100%;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(212, 163, 115, 0.1);
        }
        .nav-logo { color: #FAEDCD; text-decoration: none; letter-spacing: 4px; font-size: 22px; }
        .nav-links a { color: #FAEDCD; text-decoration: none; margin-left: 30px; font-size: 11px; text-transform: uppercase; opacity: 0.7; }

        /* 3. HERO */
        .hero { background-color: #121212; padding: 10rem 2rem 5rem; text-align: center; border-bottom: 3px solid #D4A373; }
        .hero h1 { font-size: 4rem; }

        /* 4. CONTACT SECTION LAYOUT */
        .contact-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 5rem 5%;
            display: flex; /* Fixes side-by-side layout */
            gap: 4rem;
        }

        .contact-form-wrapper { flex: 3; background: #121212; padding: 3rem; border-radius: 8px; }
        
        /* Fixed: These selectors now match the class in HTML */
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 1.5rem;
            background: transparent;
            border: 1px solid #333;
            color: white;
            border-radius: 4px;
        }

        .btn {
            padding: 12px 28px;
            background: transparent;
            color: #D4A373;
            border: 1px solid #D4A373;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { background: #D4A373; color: #121212; }

        .contact-info { flex: 2; }
        .info-block { margin-bottom: 2rem; }
        .info-block h3 { color: #D4A373; margin-bottom: 0.5rem; text-transform: uppercase; font-size: 0.9rem; }

        @media (max-width: 900px) { .contact-container { flex-direction: column; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">GOURMET</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="menues.html">Menu</a>
            <a href="About us.html">About</a>
            <a href="Contact us.html">Contact</a>
        </div>
    </nav>

    <header class="hero">
        <h1>Get in Touch</h1>
        <p>We would love to hear from you.</p>
    </header>

    <div class="contact-container">
        <div class="contact-form-wrapper">
            <h2>Send us a Message</h2>
            <!-- FIXED: Added class="contact-form" to match CSS/JS[cite: 1] -->
            <form id="contactForm" class="contact-form">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <input type="tel" placeholder="Phone Number">
                <textarea rows="5" placeholder="How can we help?" required></textarea>
                <!-- FIXED: Changed class to "btn"[cite: 1] -->
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>

        <div class="contact-info">
            <h2>Our Location</h2>
            <div class="info-block">
                <h3>Address</h3>
                <p>East Hub, Madinty, Cairo</p>
            </div>
            <div class="info-block">
                <h3>Contact</h3>
                <p>+20 1009435169</p>
                <p>reservations@Gourmet.com</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // FIXED: Selector now finds the class added above[cite: 1]
            const contactForm = document.querySelector('.contact-form');

            if (contactForm) {
                contactForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const btn = this.querySelector('.btn');
                    const oldText = btn.textContent;
                    
                    btn.textContent = 'Message Sent!';
                    btn.style.background = '#D4A373';
                    btn.style.color = '#121212';
                    
                    this.reset();
                    setTimeout(() => { btn.textContent = oldText; btn.style.background = 'transparent'; btn.style.color = '#D4A373'; }, 3000);
                });
            }
        });
    </script>
</body>
</html>
