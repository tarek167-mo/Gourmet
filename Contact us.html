<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOURMET - Contact Us</title>
    <!-- CRITICAL: This filename must match your CSS file exactly[cite: 16] -->
    <link rel="stylesheet" href="contact-design.css">
</head>
<body>
    <nav class="anim-nav">
        <a href="index.html" class="nav-logo">
            <div class="emblem"><div class="ring-solid"></div><div class="star-center"></div></div>
            <div class="logo-text">GOURMET</div>
        </a>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
        <div class="nav-links" id="nav-links">
            <a href="index.html">Home</a>
            <a href="menues.html">Menu</a>
            <a href="About us.html">About</a>
            <a href="Contact us.html">Contact</a>
            <a href="review.html">Review</a>
            <a href="login.html">Login</a>
            <a onclick="checkLoginBeforeReserve()" class="btn-nav-res">Book a Table</a>
        </div>
    </nav>

    <header class="hero">
        <h1>Get in Touch</h1>
        <p>We would love to hear from you. Book a table or ask a question.</p>
    </header>

    <div class="contact-container">
        <div class="contact-form-wrapper">
            <h2>Send us a Message</h2>
            <form class="contact-form">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <input type="tel" placeholder="Your Phone Number">
                <textarea rows="5" placeholder="How can we help you?" required></textarea>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
        <div class="contact-info">
            <h2>Our Location</h2>
            <p><strong>Address:</strong> East Hub, Madinty, Cairo</p>
            <p><strong>Phone:</strong> +20 1009435169</p>
            <p><strong>Email:</strong> reservations@Gourmet.com</p>
        </div>
    </div>

    <script src="contact-js.js"></script>
</body>
</html>
